<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Auditoria - Micro ERP</title>
    <meta charset="UTF-8">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container-fluid">
        <span class="navbar-brand">Micro ERP - Auditoria</span>
        <a href="/home" class="btn btn-light">Voltar</a>
    </div>
</nav>

<div class="container">

    <div class="card shadow-sm p-4">

        <h4>Histórico de Ações do Sistema</h4>

        <table class="table table-bordered table-hover mt-3">

            <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Usuário</th>
                <th>Perfil</th>
                <th>Módulo</th>
                <th>Ação</th>
                <th>Descrição</th>
                <th>Data/Hora</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="r : ${registros}">
                <td th:text="${r.id}"></td>
                <td th:text="${r.usuario}"></td>
                <td th:text="${r.perfil}"></td>
                <td th:text="${r.modulo}"></td>
                <td th:text="${r.acao}"></td>
                <td th:text="${r.descricao}"></td>
                <td th:text="${#temporals.format(r.dataHora, 'dd/MM/yyyy HH:mm:ss')}"></td>
            </tr>

            <tr th:if="${#lists.isEmpty(registros)}">
                <td colspan="7" class="text-center text-muted">
                    Nenhum registro de auditoria encontrado.
                </td>
            </tr>
            </tbody>

        </table>

    </div>

</div>

</body>
</html>
