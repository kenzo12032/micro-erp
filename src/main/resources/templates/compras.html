<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Compras - Micro ERP</title>
    <meta charset="UTF-8">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container-fluid">

        <span class="navbar-brand">
            Micro ERP - Compras
        </span>

        <a href="/home"
           class="btn btn-light">

            Voltar

        </a>

    </div>
</nav>

<div class="container">

    <div class="card shadow-sm p-4">

        <div class="d-flex justify-content-between align-items-center mb-4">

            <h3>Lista de Compras</h3>

            <a href="/compras/nova"
               class="btn btn-success">

                Nova Compra

            </a>

        </div>

        <table class="table table-bordered table-hover">

            <thead class="table-dark">

            <tr>
                <th>ID</th>
                <th>Fornecedor</th>
                <th>Data</th>
                <th>Valor Total</th>
                <th>Status</th>
                <th>Ações</th>
            </tr>

            </thead>

            <tbody>

            <tr th:each="compra : ${compras}">

                <td th:text="${compra.id}"></td>

                <td th:text="${compra.fornecedor.nome}"></td>

                <td th:text="${#temporals.format(compra.dataCompra, 'dd/MM/yyyy HH:mm')}"></td>

                <td>
                    R$
                    <span th:text="${#numbers.formatDecimal(compra.valorTotal,1,2)}"></span>
                </td>

                <td>

                    <span th:if="${compra.status == 'PENDENTE'}"
                          class="badge bg-warning text-dark">

                        PENDENTE

                    </span>

                    <span th:if="${compra.status == 'RECEBIDA'}"
                          class="badge bg-success">

                        RECEBIDA

                    </span>

                </td>

                <td>

                    <a th:if="${compra.status == 'PENDENTE'}"
                       th:href="@{'/compras/confirmar/' + ${compra.id}}"
                       class="btn btn-success btn-sm">

                        Confirmar Recebimento

                    </a>

                </td>

            </tr>

            <tr th:if="${#lists.isEmpty(compras)}">

                <td colspan="6"
                    class="text-center text-muted">

                    Nenhuma compra cadastrada.

                </td>

            </tr>

            </tbody>

        </table>

    </div>

</div>

</body>
</html>
