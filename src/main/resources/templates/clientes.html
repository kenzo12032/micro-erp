<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Clientes - Micro ERP</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark mb-4">
  <div class="container-fluid">
    <span class="navbar-brand">Micro ERP - Clientes</span>
    <a href="/home" class="btn btn-light">Voltar</a>
  </div>
</nav>

<div class="container">

  <div class="row g-4">

    <div class="col-md-4">
      <div class="card shadow-sm p-4">

        <h4 class="mb-3"
            th:text="${cliente.id == null} ? 'Cadastro de Cliente' : 'Editar Cliente'">
        </h4>

        <form th:action="@{/clientes/salvar}" th:object="${cliente}" method="post">

          <input type="hidden" th:field="*{id}">

          <div class="mb-3">
            <label>Nome</label>
            <input type="text" th:field="*{nome}" class="form-control" required>
          </div>

          <div class="mb-3">
            <label>CPF</label>
            <input type="text" th:field="*{cpf}" class="form-control">
          </div>

          <div class="mb-3">
            <label>Telefone</label>
            <input type="text" th:field="*{telefone}" class="form-control">
          </div>

          <div class="mb-3">
            <label>Email</label>
            <input type="email" th:field="*{email}" class="form-control">
          </div>

          <button type="submit" class="btn btn-success w-100">
            Salvar Cliente
          </button>

          <a href="/clientes" class="btn btn-secondary w-100 mt-2"
             th:if="${cliente.id != null}">
            Cancelar Edição
          </a>

        </form>
      </div>
    </div>

    <div class="col-md-8">
      <div class="card shadow-sm p-4">

        <div class="d-flex justify-content-between mb-3">
          <h4>Lista de Clientes</h4>
          <span class="badge bg-primary"
                th:text="${#lists.size(clientes)} + ' clientes'"></span>
        </div>

        <div class="table-responsive">
          <table class="table table-bordered table-hover">

            <thead class="table-dark">
            <tr>
              <th>ID</th>
              <th>Nome</th>
              <th>CPF</th>
              <th>Telefone</th>
              <th>Email</th>
              <th>Status</th>
              <th>Ações</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="c : ${clientes}">
              <td th:text="${c.id}"></td>
              <td th:text="${c.nome}"></td>
              <td th:text="${c.cpf}"></td>
              <td th:text="${c.telefone}"></td>
              <td th:text="${c.email}"></td>

              <td>
                <span th:if="${c.ativo}" class="badge bg-success">Ativo</span>
                <span th:unless="${c.ativo}" class="badge bg-danger">Inativo</span>
              </td>

              <td>
                <a th:href="@{'/clientes/editar/' + ${c.id}}"
                   class="btn btn-primary btn-sm">
                  Editar
                </a>

                <a th:href="@{'/clientes/excluir/' + ${c.id}}"
                   class="btn btn-danger btn-sm">
                  Excluir
                </a>

                <a th:if="${c.ativo}"
                   th:href="@{'/clientes/desabilitar/' + ${c.id}}"
                   class="btn btn-warning btn-sm">
                  Desabilitar
                </a>

                <a th:unless="${c.ativo}"
                   th:href="@{'/clientes/habilitar/' + ${c.id}}"
                   class="btn btn-success btn-sm">
                  Habilitar
                </a>
              </td>
            </tr>

            <tr th:if="${#lists.isEmpty(clientes)}">
              <td colspan="7" class="text-center text-muted">
                Nenhum cliente cadastrado.
              </td>
            </tr>
            </tbody>

          </table>
        </div>

      </div>
    </div>

  </div>

</div>

</body>
</html>
