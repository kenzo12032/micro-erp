<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Nova Venda - Micro ERP</title>
  <meta charset="UTF-8">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark mb-4">
  <div class="container-fluid">
    <span class="navbar-brand">Micro ERP - Nova Venda</span>
    <a href="/vendas" class="btn btn-light">Voltar</a>
  </div>
</nav>

<div class="container">

  <div class="card shadow-sm p-4">

    <h4 class="mb-4">Cadastro de Venda</h4>

    <div class="alert alert-danger" th:if="${erro}" th:text="${erro}"></div>

    <form action="/vendas/salvar" method="post">

      <div class="mb-3">
        <label>Cliente</label>
        <select name="clienteId" class="form-select" required>
          <option value="">Selecione um cliente</option>
          <option th:each="cliente : ${clientes}"
                  th:value="${cliente.id}"
                  th:text="${cliente.nome}">
          </option>
        </select>
      </div>

      <hr>

      <h5>Itens da Venda</h5>

      <div id="itens">

        <div class="row item-venda mb-3">

          <div class="col-md-5">
            <label>Produto</label>
            <select name="produtoId" class="form-select produtoSelect" required>
              <option value="">Selecione um produto</option>
              <option th:each="produto : ${produtos}"
                      th:value="${produto.id}"
                      th:data-preco="${produto.preco_venda}"
                      th:text="${produto.nome}">
              </option>
            </select>
          </div>

          <div class="col-md-2">
            <label>Quantidade</label>
            <input type="number"
                   name="quantidade"
                   class="form-control quantidade"
                   min="1"
                   value="1"
                   required>
          </div>

          <div class="col-md-3">
            <label>Valor Unitário</label>
            <input type="number"
                   step="0.01"
                   name="valorUnitario"
                   class="form-control valorUnitario"
                   min="0.01"
                   required>
          </div>

          <div class="col-md-2 d-flex align-items-end">
            <button type="button"
                    class="btn btn-danger w-100 removerItem">
              Remover
            </button>
          </div>

        </div>

      </div>

      <button type="button" id="adicionarItem" class="btn btn-primary mb-4">
        + Adicionar Item
      </button>

      <div class="mb-3">
        <label>Forma de Pagamento</label>
        <select name="formaPagamento" class="form-select" required>
          <option value="">Selecione</option>
          <option value="DINHEIRO">Dinheiro</option>
          <option value="PIX">Pix</option>
          <option value="CARTAO_DEBITO">Cartão de Débito</option>
          <option value="CARTAO_CREDITO">Cartão de Crédito</option>
        </select>
      </div>

      <button type="submit" class="btn btn-success w-100">
        Salvar Venda
      </button>

    </form>

  </div>

</div>

<script>
  function configurarEventos(container) {
      const produtoSelect = container.querySelector(".produtoSelect");
      const valorInput = container.querySelector(".valorUnitario");
      const removerBtn = container.querySelector(".removerItem");

      produtoSelect.addEventListener("change", function () {
          const option = produtoSelect.options[produtoSelect.selectedIndex];
          const preco = option.getAttribute("data-preco");

          if (preco) {
              valorInput.value = preco;
          } else {
              valorInput.value = "";
          }
      });

      removerBtn.addEventListener("click", function () {
          const itens = document.querySelectorAll(".item-venda");

          if (itens.length > 1) {
              container.remove();
          }
      });
  }

  document.querySelectorAll(".item-venda").forEach(configurarEventos);

  document.getElementById("adicionarItem").addEventListener("click", function () {
      const itens = document.getElementById("itens");
      const primeiroItem = document.querySelector(".item-venda");
      const novoItem = primeiroItem.cloneNode(true);

      novoItem.querySelector(".produtoSelect").value = "";
      novoItem.querySelector(".quantidade").value = "1";
      novoItem.querySelector(".valorUnitario").value = "";

      itens.appendChild(novoItem);

      configurarEventos(novoItem);
  });
</script>

</body>
</html>
