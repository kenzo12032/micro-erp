<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Estoque - Micro ERP</title>
    <meta charset="UTF-8">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f3f6;
        }

        header {
            background: #202529;
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header a {
            background: white;
            color: black;
            text-decoration: none;
            padding: 12px 18px;
            border-radius: 8px;
        }

        .card {
            width: 80%;
            margin: 30px auto;
            background: white;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 14px;
            text-align: left;
        }

        th {
            background: #f8f9fa;
        }

        .baixo {
            color: #dc3545;
            font-weight: bold;
        }

        .ok {
            color: #198754;
            font-weight: bold;
        }
    </style>
</head>

<body>

<header>
    <h1>Micro ERP - Estoque</h1>
    <a href="/home" class="btn btn-light">Voltar</a></header>

<div class="card">

    <h2>Produtos em Estoque</h2>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>SKU</th>
            <th>Produto</th>
            <th>Estoque Atual</th>
            <th>Estoque Mínimo</th>
            <th>Custo Médio</th>
            <th>Status</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="produto : ${produtos}">
            <td th:text="${produto.id}"></td>
            <td th:text="${produto.sku}"></td>
            <td th:text="${produto.nome}"></td>
            <td th:text="${produto.estoque}"></td>
            <td th:text="${produto.estoque_minimo}"></td>
            <td th:text="${#numbers.formatDecimal(produto.custo_medio,1,2)}"></td>

            <td>
                <span th:if="${produto.estoque <= produto.estoque_minimo}"
                      class="baixo">
                    Estoque baixo
                </span>

                <span th:if="${produto.estoque > produto.estoque_minimo}"
                      class="ok">
                    Estoque OK
                </span>
            </td>
        </tr>
        </tbody>
    </table>

</div>

</body>
</html>
