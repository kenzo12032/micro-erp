<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Produto - Micro ERP</title>
  <meta charset="UTF-8">

  <style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f1f3f6;
    }

    header {
        background: #202529;
        color: white;
        padding: 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    header a {
        background: white;
        color: black;
        text-decoration: none;
        padding: 12px 18px;
        border-radius: 8px;
    }

    .card {
        width: 60%;
        margin: 30px auto;
        background: white;
        padding: 30px;
        border-radius: 14px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }

    input {
        width: 100%;
        padding: 12px;
        margin-bottom: 20px;
        border-radius: 8px;
        border: 1px solid #ddd;
        font-size: 16px;
        box-sizing: border-box;
    }

    button {
        width: 100%;
        padding: 14px;
        border: none;
        background: #198754;
        color: white;
        border-radius: 8px;
        font-size: 18px;
        cursor: pointer;
    }

    button:hover {
        background: #157347;
    }
  </style>
</head>

<body>

<header>
  <h1>Micro ERP - Produto</h1>
  <a href="/produtos">Voltar</a>
</header>

<div class="card">

  <h2 th:text="${produto.id == null} ? 'Novo Produto' : 'Editar Produto'"></h2>

  <form th:action="@{/produtos/salvar}" th:object="${produto}" method="post">

    <input type="hidden" th:field="*{id}">

    <input type="text" th:field="*{nome}" placeholder="Nome do Produto" required>

    <input type="number" step="0.01" th:field="*{preco_custo}" placeholder="Preço de Custo" required>

    <input type="number" step="0.01" th:field="*{preco_venda}" placeholder="Preço de Venda" required>

    <input type="number" th:field="*{estoque}" placeholder="Estoque" required>

    <input type="number" th:field="*{estoque_minimo}" placeholder="Estoque Mínimo">

    <button type="submit">Salvar Produto</button>

  </form>

</div>

</body>
</html>
