<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Lucratividade - Micro ERP</title>
  <meta charset="UTF-8">

  <style>

    body{
        margin:0;
        font-family:Arial;
        background:#f1f3f6;
    }

    header{
        background:#202529;
        color:white;
        padding:22px 40px;
        display:flex;
        justify-content:space-between;
        align-items:center;
    }

    header a{
        background:white;
        color:black;
        padding:12px 18px;
        border-radius:8px;
        text-decoration:none;
    }

    .container{
        width:90%;
        margin:40px auto;
    }

    .card{
        background:white;
        padding:30px;
        border-radius:14px;
        box-shadow:0 2px 8px rgba(0,0,0,0.15);
    }

    table{
        width:100%;
        border-collapse:collapse;
    }

    th{
        background:#202529;
        color:white;
        padding:16px;
    }

    td{
        padding:16px;
        border-bottom:1px solid #ddd;
        text-align:center;
    }

    .lucro{
        color:#198754;
        font-weight:bold;
    }

    .prejuizo{
        color:#dc3545;
        font-weight:bold;
    }

  </style>

</head>

<body>

<header>

  <h1>Micro ERP - Relatório de Lucratividade</h1>

  <a href="/home">
    Voltar
  </a>

</header>

<div class="container">

  <div class="card">

    <table>

      <thead>

      <tr>
        <th>Produto</th>
        <th>Preço Venda</th>
        <th>Custo Médio</th>
        <th>Lucro Unitário</th>
        <th>Margem %</th>
      </tr>

      </thead>

      <tbody>

      <tr th:each="r : ${relatorio}">

        <td th:text="${r.produto}"></td>

        <td>
          R$
          <span th:text="${#numbers.formatDecimal(r.precoVenda,1,2)}"></span>
        </td>

        <td>
          R$
          <span th:text="${#numbers.formatDecimal(r.custoMedio,1,2)}"></span>
        </td>

        <td>

                    <span th:if="${r.lucroUnitario >= 0}"
                          class="lucro">

                        R$
                        <span th:text="${#numbers.formatDecimal(r.lucroUnitario,1,2)}"></span>

                    </span>

          <span th:if="${r.lucroUnitario < 0}"
                class="prejuizo">

                        R$
                        <span th:text="${#numbers.formatDecimal(r.lucroUnitario,1,2)}"></span>

                    </span>

        </td>

        <td>

                    <span th:if="${r.margem >= 0}"
                          class="lucro">

                        <span th:text="${#numbers.formatDecimal(r.margem,1,2)}"></span>%

                    </span>

          <span th:if="${r.margem < 0}"
                class="prejuizo">

                        <span th:text="${#numbers.formatDecimal(r.margem,1,2)}"></span>%

                    </span>

        </td>

      </tr>

      </tbody>

    </table>

  </div>

</div>

</body>
</html>
