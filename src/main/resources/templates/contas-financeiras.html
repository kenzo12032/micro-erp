<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Contas Financeiras - Micro ERP</title>
  <meta charset="UTF-8">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark mb-4">
  <div class="container-fluid">
    <span class="navbar-brand">Micro ERP - Contas a Pagar e Receber</span>
    <a href="/home" class="btn btn-light">Voltar</a>
  </div>
</nav>

<div class="container">

  <div class="row g-4">

    <div class="col-md-4">
      <div class="card shadow-sm p-4">

        <h4>Nova Conta</h4>

        <form th:action="@{/contas-financeiras/salvar}"
              th:object="${conta}"
              method="post">

          <div class="mb-3">
            <label>Descrição</label>
            <input type="text" th:field="*{descricao}" class="form-control" required>
          </div>

          <div class="mb-3">
            <label>Tipo</label>
            <select th:field="*{tipo}" class="form-select" required>
              <option value="">Selecione</option>
              <option value="PAGAR">Conta a Pagar</option>
              <option value="RECEBER">Conta a Receber</option>
            </select>
          </div>

          <div class="mb-3">
            <label>Valor</label>
            <input type="number" step="0.01" th:field="*{valor}" class="form-control" required>
          </div>

          <div class="mb-3">
            <label>Data de Vencimento</label>
            <input type="date" th:field="*{dataVencimento}" class="form-control">
          </div>

          <button class="btn btn-success w-100">
            Salvar Conta
          </button>

        </form>

      </div>
    </div>

    <div class="col-md-8">
      <div class="card shadow-sm p-4">

        <h4>Lista de Contas</h4>

        <table class="table table-bordered table-hover mt-3">

          <thead class="table-dark">
          <tr>
            <th>ID</th>
            <th>Descrição</th>
            <th>Tipo</th>
            <th>Valor</th>
            <th>Vencimento</th>
            <th>Pagamento</th>
            <th>Status</th>
            <th>Ação</th>
          </tr>
          </thead>

          <tbody>
          <tr th:each="c : ${contas}">
            <td th:text="${c.id}"></td>

            <td th:text="${c.descricao}"></td>

            <td th:text="${c.tipo}"></td>

            <td>
              R$ <span th:text="${#numbers.formatDecimal(c.valor,1,2)}"></span>
            </td>

            <td th:text="${c.dataVencimento}"></td>

            <td th:text="${c.dataPagamento}"></td>

            <td>
                            <span th:if="${c.status == 'PENDENTE'}"
                                  class="badge bg-warning text-dark">
                                PENDENTE
                            </span>

              <span th:if="${c.status == 'ATRASADO'}"
                    class="badge bg-danger">
                                ATRASADO
                            </span>

              <span th:if="${c.status == 'PAGO'}"
                    class="badge bg-secondary">
                                PAGO
                            </span>

              <span th:if="${c.status == 'RECEBIDO'}"
                    class="badge bg-success">
                                RECEBIDO
                            </span>
            </td>

            <td>
              <a th:if="${c.status == 'PENDENTE' or c.status == 'ATRASADO'}"
                 th:href="@{'/contas-financeiras/baixar/' + ${c.id}}"
                 class="btn btn-primary btn-sm">
                Baixar
              </a>
            </td>
          </tr>

          <tr th:if="${#lists.isEmpty(contas)}">
            <td colspan="8" class="text-center text-muted">
              Nenhuma conta cadastrada.
            </td>
          </tr>
          </tbody>

        </table>

      </div>
    </div>

  </div>

</div>

</body>
</html>
