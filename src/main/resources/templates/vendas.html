<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Vendas - Micro ERP</title>
    <meta charset="UTF-8">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f3f6;
        }

        header {
            background: #202529;
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            margin: 0;
            font-size: 26px;
            font-weight: normal;
        }

        header a {
            background: white;
            color: black;
            padding: 12px 18px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 18px;
        }

        .card {
            background: white;
            width: 70%;
            margin: 30px auto;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        h2 {
            font-size: 28px;
            margin-bottom: 25px;
        }

        .btn {
            display: inline-block;
            background: #198754;
            color: white;
            padding: 14px 20px;
            border-radius: 8px;
            text-decoration: none;
            margin-bottom: 20px;
            font-size: 18px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 18px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 14px;
            text-align: left;
        }

        th {
            font-weight: bold;
        }

        .status {
            color: #198754;
            font-weight: bold;
        }
    </style>
</head>

<body>

<header>
    <h1>Micro ERP - Vendas</h1>
    <a href="/home" class="btn btn-light">Voltar</a>
</header>

<div class="card">

    <h2>Lista de Vendas</h2>

    <a class="btn" href="/vendas/nova">+ Nova Venda</a>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Cliente</th>
            <th>Valor Total</th>
            <th>Status</th>
            <th>Data</th>
            <th>PDF</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="venda : ${vendas}">
            <td th:text="${venda.id}"></td>
            <td th:text="${venda.cliente.nome}"></td>
            <td th:text="${venda.valorTotal}"></td>
            <td>
                <span class="status"
                      th:text="${venda.status}">
                </span>
            </td>
            <td th:text="${venda.dataVenda}"></td>
            <td>
                <a th:href="@{'/vendas/pdf/' + ${venda.id}}"
                   target="_blank">
                    Gerar PDF
                </a>
            </td>
        </tr>
        </tbody>
    </table>

</div>

</body>
</html>
