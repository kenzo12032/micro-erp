<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Usuários - Micro ERP</title>
  <meta charset="UTF-8">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark mb-4">
  <div class="container-fluid">
    <span class="navbar-brand">Micro ERP - Usuários</span>
    <a href="/home" class="btn btn-light">Voltar</a>
  </div>
</nav>

<div class="container">

  <div class="row g-4">

    <div class="col-md-4">
      <div class="card shadow-sm p-4">

        <h4 class="mb-3"
            th:text="${usuario.id == null} ? 'Novo Usuário' : 'Editar Usuário'">
        </h4>

        <form th:action="@{/usuarios/salvar}"
              th:object="${usuario}"
              method="post">

          <input type="hidden" th:field="*{id}">

          <div class="mb-3">
            <label>Usuário</label>
            <input type="text"
                   th:field="*{username}"
                   class="form-control"
                   required>
          </div>

          <div class="mb-3">
            <label>Senha</label>
            <input type="text"
                   th:field="*{senha}"
                   class="form-control"
                   required>
          </div>

          <div class="mb-3">
            <label>Perfil</label>
            <select th:field="*{perfil}" class="form-select" required>
              <option value="">Selecione</option>
              <option value="ADMIN">ADMIN</option>
              <option value="VENDAS">VENDAS</option>
              <option value="ESTOQUE">ESTOQUE</option>
              <option value="COMPRAS">COMPRAS</option>
              <option value="FINANCEIRO">FINANCEIRO</option>
            </select>
          </div>

          <button class="btn btn-success w-100">
            Salvar Usuário
          </button>

          <a href="/usuarios"
             class="btn btn-secondary w-100 mt-2"
             th:if="${usuario.id != null}">
            Cancelar Edição
          </a>

        </form>

      </div>
    </div>

    <div class="col-md-8">
      <div class="card shadow-sm p-4">

        <h4>Lista de Usuários</h4>

        <table class="table table-bordered table-hover mt-3">

          <thead class="table-dark">
          <tr>
            <th>ID</th>
            <th>Usuário</th>
            <th>Perfil</th>
            <th>Status</th>
            <th>Ações</th>
          </tr>
          </thead>

          <tbody>
          <tr th:each="u : ${usuarios}">
            <td th:text="${u.id}"></td>
            <td th:text="${u.username}"></td>
            <td th:text="${u.perfil}"></td>

            <td>
              <span th:if="${u.ativo}" class="badge bg-success">Ativo</span>
              <span th:unless="${u.ativo}" class="badge bg-danger">Inativo</span>
            </td>

            <td>
              <a th:href="@{'/usuarios/editar/' + ${u.id}}"
                 class="btn btn-primary btn-sm">
                Editar
              </a>

              <a th:href="@{'/usuarios/excluir/' + ${u.id}}"
                 class="btn btn-danger btn-sm">
                Excluir
              </a>

              <a th:if="${u.ativo}"
                 th:href="@{'/usuarios/desabilitar/' + ${u.id}}"
                 class="btn btn-warning btn-sm">
                Desabilitar
              </a>

              <a th:unless="${u.ativo}"
                 th:href="@{'/usuarios/habilitar/' + ${u.id}}"
                 class="btn btn-success btn-sm">
                Habilitar
              </a>
            </td>
          </tr>

          <tr th:if="${#lists.isEmpty(usuarios)}">
            <td colspan="5" class="text-center text-muted">
              Nenhum usuário cadastrado.
            </td>
          </tr>
          </tbody>

        </table>

      </div>
    </div>

  </div>

</div>

</body>
</html>
