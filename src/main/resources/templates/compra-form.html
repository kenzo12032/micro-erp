<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Nova Compra - Micro ERP</title>
  <meta charset="UTF-8">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark mb-4">
  <div class="container-fluid">
    <span class="navbar-brand">Micro ERP - Nova Compra</span>
    <a href="/compras" class="btn btn-light">Voltar</a>
  </div>
</nav>

<div class="container">

  <div class="card shadow-sm p-4">

    <h4 class="mb-4">Cadastro de Compra</h4>

    <form action="/compras/salvar" method="post">

      <div class="mb-3">
        <label>Fornecedor</label>
        <select name="fornecedorId" class="form-select" required>
          <option value="">Selecione um fornecedor</option>
          <option th:each="fornecedor : ${fornecedores}"
                  th:value="${fornecedor.id}"
                  th:text="${fornecedor.nome}">
          </option>
        </select>
      </div>

      <hr>

      <h5>Itens da Compra</h5>

      <div id="itens">

        <div class="row item-compra mb-3">

          <div class="col-md-5">
            <label>Produto</label>
            <select name="produtoId" class="form-select" required>
              <option value="">Selecione um produto</option>
              <option th:each="produto : ${produtos}"
                      th:value="${produto.id}"
                      th:text="${produto.nome}">
              </option>
            </select>
          </div>

          <div class="col-md-2">
            <label>Quantidade</label>
            <input type="number"
                   name="quantidade"
                   class="form-control"
                   min="1"
                   value="1"
                   required>
          </div>

          <div class="col-md-3">
            <label>Valor Unitário</label>
            <input type="number"
                   step="0.01"
                   name="valorUnitario"
                   class="form-control"
                   min="0.01"
                   required>
          </div>

          <div class="col-md-2 d-flex align-items-end">
            <button type="button"
                    class="btn btn-danger w-100 removerItem">
              Remover
            </button>
          </div>

        </div>

      </div>

      <button type="button" id="adicionarItem" class="btn btn-primary mb-4">
        + Adicionar Item
      </button>

      <button type="submit" class="btn btn-success w-100">
        Salvar Compra
      </button>

    </form>

  </div>

</div>

<script>
  function configurarEventos(container) {
      const removerBtn = container.querySelector(".removerItem");

      removerBtn.addEventListener("click", function () {
          const itens = document.querySelectorAll(".item-compra");

          if (itens.length > 1) {
              container.remove();
          }
      });
  }

  document.querySelectorAll(".item-compra").forEach(configurarEventos);

  document.getElementById("adicionarItem").addEventListener("click", function () {
      const itens = document.getElementById("itens");
      const primeiroItem = document.querySelector(".item-compra");
      const novoItem = primeiroItem.cloneNode(true);

      novoItem.querySelector("select").value = "";
      novoItem.querySelector("input[name='quantidade']").value = "1";
      novoItem.querySelector("input[name='valorUnitario']").value = "";

      itens.appendChild(novoItem);

      configurarEventos(novoItem);
  });
</script>

</body>
</html>
