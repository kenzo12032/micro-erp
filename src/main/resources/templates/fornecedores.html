<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Fornecedores - Micro ERP</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container-fluid">
        <span class="navbar-brand">Micro ERP - Fornecedores</span>
        <a href="/home" class="btn btn-light">Voltar</a>
    </div>
</nav>

<div class="container">

    <div class="row g-4">

        <div class="col-md-4">
            <div class="card shadow-sm p-4">

                <h4 class="mb-3"
                    th:text="${fornecedor.id == null} ? 'Cadastro de Fornecedor' : 'Editar Fornecedor'">
                </h4>

                <form th:action="@{/fornecedores/salvar}" th:object="${fornecedor}" method="post">

                    <input type="hidden" th:field="*{id}">

                    <div class="mb-3">
                        <label>Nome</label>
                        <input type="text" th:field="*{nome}" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label>CNPJ</label>
                        <input type="text" th:field="*{cnpj}" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label>Telefone</label>
                        <input type="text" th:field="*{telefone}" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label>Email</label>
                        <input type="email" th:field="*{email}" class="form-control">
                    </div>

                    <button type="submit" class="btn btn-success w-100">
                        Salvar Fornecedor
                    </button>

                    <a href="/fornecedores" class="btn btn-secondary w-100 mt-2"
                       th:if="${fornecedor.id != null}">
                        Cancelar Edição
                    </a>

                </form>
            </div>
        </div>

        <div class="col-md-8">
            <div class="card shadow-sm p-4">

                <div class="d-flex justify-content-between mb-3">
                    <h4>Lista de Fornecedores</h4>
                    <span class="badge bg-primary"
                          th:text="${#lists.size(fornecedores)} + ' fornecedores'"></span>
                </div>

                <div class="table-responsive">
                    <table class="table table-bordered table-hover">

                        <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Nome</th>
                            <th>CNPJ</th>
                            <th>Telefone</th>
                            <th>Email</th>
                            <th>Status</th>
                            <th>Ações</th>
                        </tr>
                        </thead>

                        <tbody>
                        <tr th:each="f : ${fornecedores}">
                            <td th:text="${f.id}"></td>
                            <td th:text="${f.nome}"></td>
                            <td th:text="${f.cnpj}"></td>
                            <td th:text="${f.telefone}"></td>
                            <td th:text="${f.email}"></td>

                            <td>
                                <span th:if="${f.ativo}" class="badge bg-success">Ativo</span>
                                <span th:unless="${f.ativo}" class="badge bg-danger">Inativo</span>
                            </td>

                            <td>
                                <a th:href="@{'/fornecedores/editar/' + ${f.id}}"
                                   class="btn btn-primary btn-sm">
                                    Editar
                                </a>

                                <a th:href="@{'/fornecedores/excluir/' + ${f.id}}"
                                   class="btn btn-danger btn-sm">
                                    Excluir
                                </a>

                                <a th:if="${f.ativo}"
                                   th:href="@{'/fornecedores/desabilitar/' + ${f.id}}"
                                   class="btn btn-warning btn-sm">
                                    Desabilitar
                                </a>

                                <a th:unless="${f.ativo}"
                                   th:href="@{'/fornecedores/habilitar/' + ${f.id}}"
                                   class="btn btn-success btn-sm">
                                    Habilitar
                                </a>
                            </td>
                        </tr>

                        <tr th:if="${#lists.isEmpty(fornecedores)}">
                            <td colspan="7" class="text-center text-muted">
                                Nenhum fornecedor cadastrado.
                            </td>
                        </tr>
                        </tbody>

                    </table>
                </div>

            </div>
        </div>

    </div>

</div>

</body>
</html>
