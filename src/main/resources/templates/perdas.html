<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Perdas de Estoque</title>

  <meta charset="UTF-8">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark mb-4">
  <div class="container-fluid">
        <span class="navbar-brand">
            Micro ERP - Perdas de Estoque
        </span>

    <a href="/home"
       class="btn btn-light">

      Voltar

    </a>
  </div>
</nav>

<div class="container">

  <div class="row g-4">

    <div class="col-md-4">

      <div class="card shadow-sm p-4">

        <h4>Registrar Perda</h4>

        <form action="/perdas/salvar"
              method="post">

          <div class="mb-3">

            <label>Produto</label>

            <select name="produtoId"
                    class="form-select">

              <option th:each="p : ${produtos}"
                      th:value="${p.id}"
                      th:text="${p.nome}">
              </option>

            </select>

          </div>

          <div class="mb-3">

            <label>Quantidade</label>

            <input type="number"
                   name="quantidade"
                   class="form-control"
                   required>

          </div>

          <div class="mb-3">

            <label>Motivo</label>

            <select name="motivo"
                    class="form-select">

              <option value="QUEBRA">Quebra</option>
              <option value="VALIDADE">Validade</option>
              <option value="ROUBO">Roubo</option>
              <option value="AJUSTE">Ajuste</option>

            </select>

          </div>

          <div class="mb-3">

            <label>Observação</label>

            <textarea name="observacao"
                      class="form-control"></textarea>

          </div>

          <button class="btn btn-danger w-100">

            Registrar Perda

          </button>

        </form>

      </div>

    </div>

    <div class="col-md-8">

      <div class="card shadow-sm p-4">

        <h4>Histórico de Perdas</h4>

        <table class="table table-bordered table-hover mt-3">

          <thead class="table-dark">

          <tr>
            <th>ID</th>
            <th>Produto</th>
            <th>Qtd</th>
            <th>Motivo</th>
            <th>Prejuízo</th>
          </tr>

          </thead>

          <tbody>

          <tr th:each="p : ${perdas}">

            <td th:text="${p.id}"></td>

            <td th:text="${p.produto.nome}"></td>

            <td th:text="${p.quantidade}"></td>

            <td th:text="${p.motivo}"></td>

            <td>
              R$
              <span th:text="${#numbers.formatDecimal(p.valorPrejuizo,1,2)}"></span>
            </td>

          </tr>

          </tbody>

        </table>

      </div>

    </div>

  </div>

</div>

</body>
</html>
