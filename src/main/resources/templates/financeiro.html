<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Financeiro - Micro ERP</title>
    <meta charset="UTF-8">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container-fluid">
        <span class="navbar-brand">Micro ERP - Financeiro</span>
        <a href="/home" class="btn btn-light">Voltar</a>
    </div>
</nav>

<div class="container">

    <div class="row mb-4">

        <div class="col-md-4">
            <div class="card shadow-sm p-4">
                <h5>Total de Créditos</h5>
                <h3 class="text-success">
                    R$ <span th:text="${#numbers.formatDecimal(totalCreditos,1,2)}"></span>
                </h3>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card shadow-sm p-4">
                <h5>Total de Débitos</h5>
                <h3 class="text-danger">
                    R$ <span th:text="${#numbers.formatDecimal(totalDebitos,1,2)}"></span>
                </h3>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card shadow-sm p-4">
                <h5>Saldo Financeiro</h5>
                <h3 class="text-primary">
                    R$ <span th:text="${#numbers.formatDecimal(saldo,1,2)}"></span>
                </h3>
            </div>
        </div>

    </div>

    <div class="row g-4">

        <div class="col-md-4">
            <div class="card shadow-sm p-4">

                <h4>Novo Lançamento</h4>

                <form th:action="@{/financeiro/salvar}"
                      th:object="${movimentacao}"
                      method="post">

                    <div class="mb-3">
                        <label>Plano de Conta</label>
                        <select th:field="*{planoConta}" class="form-select">
                            <option value="">Selecione</option>
                            <option th:each="conta : ${contas}"
                                    th:value="${conta.id}"
                                    th:text="${conta.descricao}">
                            </option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label>Descrição</label>
                        <input type="text"
                               th:field="*{descricao}"
                               class="form-control"
                               required>
                    </div>

                    <div class="mb-3">
                        <label>Tipo</label>
                        <select th:field="*{tipo}" class="form-select" required>
                            <option value="CREDITO">Crédito</option>
                            <option value="DEBITO">Débito</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label>Valor</label>
                        <input type="number"
                               step="0.01"
                               th:field="*{valor}"
                               class="form-control"
                               required>
                    </div>

                    <button class="btn btn-success w-100">
                        Salvar Lançamento
                    </button>

                </form>

            </div>
        </div>

        <div class="col-md-8">
            <div class="card shadow-sm p-4">

                <h4>Histórico Financeiro</h4>

                <table class="table table-bordered table-hover mt-3">

                    <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Descrição</th>
                        <th>Tipo</th>
                        <th>Valor</th>
                        <th>Origem</th>
                        <th>Status</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="m : ${movimentacoes}">
                        <td th:text="${m.id}"></td>
                        <td th:text="${m.descricao}"></td>
                        <td>
                            <span th:if="${m.tipo == 'CREDITO'}"
                                  class="badge bg-success">
                                Crédito
                            </span>

                            <span th:if="${m.tipo == 'DEBITO'}"
                                  class="badge bg-danger">
                                Débito
                            </span>
                        </td>
                        <td>
                            R$ <span th:text="${#numbers.formatDecimal(m.valor,1,2)}"></span>
                        </td>
                        <td th:text="${m.origem}"></td>
                        <td th:text="${m.status}"></td>
                    </tr>

                    <tr th:if="${#lists.isEmpty(movimentacoes)}">
                        <td colspan="6" class="text-center text-muted">
                            Nenhuma movimentação financeira registrada.
                        </td>
                    </tr>
                    </tbody>

                </table>

            </div>
        </div>

    </div>

</div>

</body>
</html>
